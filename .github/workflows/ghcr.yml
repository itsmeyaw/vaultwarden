name: GHCR (fork)
permissions: {}

# Fork-only image for the org VM: amd64 Debian build pushed to ghcr.io/<owner>/vaultwarden.
# Upstream's release.yml only runs on dani-garcia/vaultwarden.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  ghcr:
    name: Build and push amd64 image
    if: ${{ github.repository == 'itsmeyaw/vaultwarden' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # Push to ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # build.rs derives the version from git tags

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker buildx build \
            --file docker/Dockerfile.debian \
            --platform linux/amd64 \
            --cache-from "type=registry,ref=${IMAGE}:buildcache" \
            --cache-to "type=registry,ref=${IMAGE}:buildcache,mode=max" \
            --tag "${IMAGE}:main" \
            --tag "${IMAGE}:sha-${GITHUB_SHA::12}" \
            --metadata-file metadata.json \
            --push \
            .
          echo "Digest: $(jq -r '."containerimage.digest"' metadata.json)" | tee -a "${GITHUB_STEP_SUMMARY}"
